board: kilter
db_path: data/kilter.sqlite
layout_id: 1                     # original layout - discover from database
set_ids: [1]
angle_conditioning: true
angle_range: [0, 70]
size_conditioning: true
available_sizes: ["7x10", "8x12", "12x12", "16x12"]
default_size: "16x12"            # largest size - used for vocabulary construction
L_max: 32                       # Kilter climbs can be longer
model_size: small

# Sample weighting hyperparameters
weighting:
  alpha: 2.0
  beta: 1.0
  gamma: 0.5

# Training hyperparameters
training:
  batch_size: 128
  learning_rate: 3.0e-4
  warmup_steps: 1000
  epochs: 200
  ema_decay: 0.9999
  p_uncond: 0.1

role_colors:
  start: "#00FF00"
  middle: "#00FFFF"
  finish: "#FF00FF"
  foot_only: "#FFFF00"

deep_link_scheme: "kilterboard://climb/"
