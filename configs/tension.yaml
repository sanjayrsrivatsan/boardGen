board: tension
db_path: data/tension.sqlite
layout_id: 10                    # Tension Board 2 Mirror layout
set_ids: [12, 13]               # TB2 hold sets (wood + dual-tex)
angle_conditioning: true
angle_range: [0, 65]
size_conditioning: true
# Sizes from product_sizes: 6=12x12, 7=10x12, 8=12x8, 9=10x8
available_sizes: ["10x8", "12x8", "10x12", "12x12"]
default_size: "12x12"            # largest size - used for vocabulary construction
L_max: 24
model_size: small                # "small" or "full"

# Sample weighting hyperparameters
weighting:
  alpha: 2.0   # classic weight
  beta: 1.0    # log(ascent_count) weight
  gamma: 0.5   # quality weight

# Training hyperparameters
training:
  batch_size: 64
  learning_rate: 3.0e-4
  weight_decay: 0.0
  warmup_steps: 1000
  epochs: 1000
  ema_decay: 0.9999
  p_uncond: 0.15

# Board-specific visualization
role_colors:
  start: "#00FF00"
  middle: "#0000FF"
  finish: "#FF0000"
  foot_only: "#FF00FF"

deep_link_scheme: "tensionboard2://climb/"
