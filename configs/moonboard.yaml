board: moonboard
db_path: data/moonboard.sqlite
layout_id: 1                     # 2024 set at 40 - discover from database
set_ids: [1]
angle_conditioning: false        # fixed angle
default_angle: 40
L_max: 24
model_size: small

# Sample weighting hyperparameters
weighting:
  alpha: 2.0
  beta: 1.0
  gamma: 0.5

# Training hyperparameters
training:
  batch_size: 64
  learning_rate: 3.0e-4
  warmup_steps: 1000
  epochs: 300
  ema_decay: 0.9999
  p_uncond: 0.1

role_colors:
  start: "#00FF00"
  middle: "#0000FF"
  finish: "#FF0000"

deep_link_scheme: "moonboard://climb/"
